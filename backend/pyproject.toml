[project]
name = "skiper-backend"
version = "0.1.0"
description = "Skiper backend API for YouTube transcript scoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beartype>=0.19.0",
  "fastapi>=0.115.13",
  "openai>=2.0.0",
  "pydantic-settings>=2.10.1",
  "uvicorn[standard]>=0.34.0",
  "youtube-transcript-api>=1.2.2"
]

[dependency-groups]
dev = [
  "mypy>=1.16.0",
  "pyright>=1.1.402"
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.uv]
package = false
